name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: nanfaweb
          outputs: dist/github-contribution-grid-snake-dark.svg

      - name: Commit snake SVG
        run: |
          mkdir -p assets
          cp dist/github-contribution-grid-snake-dark.svg assets/snake.svg
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add assets/snake.svg
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git push
